services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_PATH: /app/data/notice.sqlite3
      APP_ENV: production
    volumes:
      - notice_data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    mem_limit: 1g
    pids_limit: 128
    # No published backend port. Reach only through the TLS proxy.
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [app]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Set your real host in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    security_opt:
      - no-new-privileges:true
volumes:
  notice_data:
  caddy_data:
  caddy_config:
