<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#050b14">
  <title>NAVLYNX Android 16 升級專區｜兩階段更新預覽</title>
  <style>
    html,body{width:100%;height:100%;margin:0;background:#050b14;overflow:hidden}
    iframe{display:block;width:100%;height:100%;border:0;background:#050b14}
    .loading{position:fixed;inset:0;z-index:3;display:grid;place-items:center;background:#050b14;color:#eaf5ff;font-family:"Noto Sans TC","Microsoft JhengHei",Arial,sans-serif;transition:opacity .25s ease}
    .loading.hide{opacity:0;pointer-events:none}
    .loading-box{width:min(410px,calc(100% - 40px));padding:27px;border:1px solid rgba(72,197,255,.22);border-radius:20px;background:#0b192b;text-align:center;box-shadow:0 24px 70px rgba(0,0,0,.35)}
    .spinner{width:34px;height:34px;margin:0 auto 15px;border:3px solid rgba(255,255,255,.18);border-top-color:#31c8ff;border-radius:50%;animation:spin .8s linear infinite}
    .loading b{display:block;font-size:18px}.loading span{display:block;margin-top:5px;color:#9db3c8;font-size:14px}@keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <div class="loading" id="loading"><div class="loading-box"><div class="spinner"></div><b>正在載入更新版預覽</b><span>套用各機型兩階段 Android 16 完整步驟</span></div></div>
  <iframe id="preview" src="preview-v2.html?v=20260905-5" title="NAVLYNX Android 16 升級專區預覽"></iframe>
  <script>
    const preview = document.getElementById('preview');
    const loading = document.getElementById('loading');
    let applied = false;

    function getSiteDocument(){
      try{
        const wrapperDoc = preview.contentDocument || preview.contentWindow.document;
        const siteFrame = wrapperDoc && wrapperDoc.getElementById('site');
        return siteFrame && (siteFrame.contentDocument || siteFrame.contentWindow.document);
      }catch(error){
        return null;
      }
    }

    function applyFinalUpdates(){
      if(applied) return true;
      const doc = getSiteDocument();
      if(!doc || !doc.body) return false;

      const prep = doc.querySelector('#self .prep');
      const prepList = prep && prep.querySelector('ul');
      const cards = [...doc.querySelectorAll('.download-card')];
      const oldTriggers = [...doc.querySelectorAll('.firmware-guide-trigger')];
      if(!prepList || cards.length < 4 || oldTriggers.length < 4) return false;

      [...prepList.querySelectorAll('li')].forEach((item) => {
        const text = item.textContent.trim();
        if(text.includes('首次升級至 Android 16 指定過渡版本') || text.includes('升級至 Android 16 過渡版本後')) item.remove();
      });
      prep.querySelector('.blind-flash-note')?.remove();
      prep.querySelector('.notice')?.remove();

      doc.querySelector('.firmware-modal')?.remove();
      oldTriggers.forEach((button) => button.remove());

      const guides = {
        'ApplePie ONE': {
          title: 'ApplePie ONE 首次升級 Android 16 步驟',
          file: 'APM1288BM.zip',
          product: 'ApplePie ONE'
        },
        'ApplePie Touch': {
          title: 'ApplePie Touch 首次升級 Android 16 步驟',
          file: 'APM1288TOUCH.zip',
          product: 'ApplePie Touch'
        },
        'ApplePie mini Ultra II': {
          title: 'ApplePie mini Ultra II 首次升級 Android 16 步驟',
          file: 'APM1688S.zip',
          product: 'ApplePie mini Ultra II'
        },
        'ApplePie Melling／Melling-G': {
          title: 'ApplePie Melling／Melling-G 首次升級 Android 16 步驟',
          file: 'APM1288BM.zip',
          product: 'ApplePie Melling 或 Melling-G'
        }
      };

      const guideHTML = (guide) => `
        <div class="a16-phase-alert">
          <strong>本次首次升級分為兩個階段</strong>
          <p>第一階段先升級至 Android 16 指定過渡版本，完成後還必須繼續更新至 Android 16 最新韌體。</p>
          <b>請勿停留在過渡版本，以免發生車機顯示或連線相容性問題。</b>
        </div>
        <div class="a16-guide-steps">
          <section class="a16-guide-step">
            <h4><span>1</span>下載過渡版本升級檔案</h4>
            <p>使用電腦開啟官方下載連結，下載 <code>${guide.file}</code>，並複製至 Micro SD 卡根目錄。檔案請勿解壓縮。</p>
          </section>
          <section class="a16-guide-step">
            <h4><span>2</span>插入記憶卡</h4>
            <p>讓 ${guide.product} 正常開機並停留在主畫面，再將記憶卡插入主機插槽。</p>
          </section>
          <section class="a16-guide-step">
            <h4><span>3</span>確認開始更新</h4>
            <p>畫面顯示是否更新時，確認資訊後點選「更新」。</p>
          </section>
          <section class="a16-guide-step">
            <h4><span>4</span>紅燈閃爍後取出記憶卡</h4>
            <p>更新過程中，當電源燈號顯示紅燈閃爍時，將記憶卡取出。</p>
          </section>
          <section class="a16-guide-step">
            <h4><span>5</span>等待過渡版本更新完成</h4>
            <p>更新時間約 10 至 15 分鐘。過程中請保持穩定供電，完成後 ApplePie 將自動重新啟動。</p>
            <p class="a16-step-emphasis">此時僅代表已完成 Android 16 過渡版本更新，尚未完成全部升級流程，請繼續進行下一步。</p>
          </section>
          <section class="a16-guide-step a16-required-step">
            <div class="a16-required-label">必要步驟｜請勿省略</div>
            <h4><span>6</span>更新至 Android 16 最新韌體</h4>
            <p>完成過渡版本後，請前往 NAVLYNX 最新韌體下載頁，下載該機型對應的 Android 16 最新韌體，並依照相同方式再次更新。</p>
            <strong class="a16-do-not-stop">請勿停留在過渡版本。</strong>
            <div class="a16-blind-note">
              <strong>過渡版本無畫面時怎麼辦？</strong>
              <p>部分車款可能因過渡版本的相容性問題，暫時無法在車機螢幕顯示 ApplePie 畫面。若遇到無畫面的情況，請勿中斷升級流程，請參考「更新指示燈號盲刷」，在沒有畫面的情況下，依照主機燈號判斷更新狀態，繼續完成 Android 16 最新韌體更新。</p>
            </div>
            <a class="a16-latest-link" href="https://www.navlynx.com.tw/download.asp" target="_blank" rel="noopener">前往 Android 16 最新韌體下載</a>
          </section>
        </div>`;

      const modal = doc.createElement('div');
      modal.className = 'a16-modal';
      modal.hidden = true;
      modal.setAttribute('aria-hidden','true');
      modal.innerHTML = `
        <div class="a16-modal-panel" role="dialog" aria-modal="true" aria-labelledby="a16-modal-title" tabindex="-1">
          <button type="button" class="a16-modal-close" aria-label="關閉完整升級步驟">×</button>
          <div class="a16-modal-kicker">ANDROID 16 FIRST UPGRADE GUIDE</div>
          <h3 id="a16-modal-title"></h3>
          <div class="a16-modal-content"></div>
        </div>`;
      doc.body.appendChild(modal);

      const panel = modal.querySelector('.a16-modal-panel');
      const title = modal.querySelector('#a16-modal-title');
      const content = modal.querySelector('.a16-modal-content');
      const closeButton = modal.querySelector('.a16-modal-close');
      let lastTrigger = null;

      function openModal(guide, trigger){
        lastTrigger = trigger;
        title.textContent = guide.title;
        content.innerHTML = guideHTML(guide);
        modal.hidden = false;
        modal.setAttribute('aria-hidden','false');
        doc.documentElement.classList.add('a16-modal-open');
        doc.body.classList.add('a16-modal-open');
        requestAnimationFrame(() => {
          modal.classList.add('is-open');
          panel.focus();
        });
      }

      function closeModal(){
        if(modal.hidden) return;
        modal.classList.remove('is-open');
        doc.documentElement.classList.remove('a16-modal-open');
        doc.body.classList.remove('a16-modal-open');
        setTimeout(() => {
          modal.hidden = true;
          modal.setAttribute('aria-hidden','true');
          content.innerHTML = '';
          lastTrigger?.focus();
        },180);
      }

      cards.forEach((card) => {
        const name = card.querySelector('h3')?.textContent.trim();
        const guide = guides[name];
        if(!guide) return;
        const trigger = doc.createElement('button');
        trigger.type = 'button';
        trigger.className = 'a16-guide-trigger';
        trigger.textContent = '查看首次升級完整步驟';
        trigger.setAttribute('aria-haspopup','dialog');
        trigger.addEventListener('click', () => openModal(guide, trigger));
        card.appendChild(trigger);
      });

      closeButton.addEventListener('click', closeModal);
      modal.addEventListener('click', (event) => {
        if(event.target === modal) closeModal();
      });
      doc.addEventListener('keydown', (event) => {
        if(event.key === 'Escape' && !modal.hidden) closeModal();
      });

      const style = doc.createElement('style');
      style.textContent = `
        .a16-guide-trigger{display:inline-flex;align-items:center;justify-content:center;align-self:center;width:auto;margin-top:12px;padding:4px 5px;border:0;background:transparent;color:#0877d8;font:inherit;font-size:13px;font-weight:900;line-height:1.5;text-decoration:underline;text-underline-offset:4px;cursor:pointer}
        .a16-guide-trigger:hover{color:#045da9}
        .a16-guide-trigger:focus-visible{outline:3px solid rgba(22,135,255,.28);outline-offset:4px;border-radius:5px}
        html.a16-modal-open,body.a16-modal-open{overflow:hidden!important;touch-action:none}
        .a16-modal[hidden]{display:none!important}
        .a16-modal{position:fixed;inset:0;z-index:100000;display:grid;place-items:center;padding:24px;background:rgba(2,8,18,.74);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);opacity:0;transition:opacity .18s ease}
        .a16-modal.is-open{opacity:1}
        .a16-modal-panel{position:relative;width:min(760px,100%);max-height:calc(100vh - 48px);max-height:calc(100dvh - 48px);overflow:auto;overscroll-behavior:contain;padding:34px 34px 30px;border:1px solid #d7e3ef;border-radius:24px;background:#fff;color:#14233a;box-shadow:0 30px 90px rgba(0,0,0,.4);transform:translateY(12px) scale(.985);transition:transform .18s ease;-webkit-overflow-scrolling:touch}
        .a16-modal.is-open .a16-modal-panel{transform:translateY(0) scale(1)}
        .a16-modal-panel:focus{outline:none}
        .a16-modal-close{position:sticky;float:right;top:0;z-index:3;width:42px;height:42px;margin:-13px -13px 0 16px;border:1px solid #dbe4ed;border-radius:50%;background:#fff;color:#26384d;font-size:30px;font-weight:300;line-height:1;cursor:pointer;box-shadow:0 8px 24px rgba(10,35,65,.13)}
        .a16-modal-close:hover{background:#edf6ff;color:#0877d8}
        .a16-modal-close:focus-visible{outline:3px solid rgba(22,135,255,.3);outline-offset:3px}
        .a16-modal-kicker{margin-bottom:6px;color:#0877d8;font-size:11px;font-weight:900;letter-spacing:.13em}
        .a16-modal h3{margin:0;padding-right:50px;font-size:clamp(23px,4vw,31px);line-height:1.25;letter-spacing:-.025em;color:#11243d}
        .a16-modal-content{clear:both;margin-top:22px}
        .a16-phase-alert{margin-bottom:16px;padding:17px 18px;border:1px solid #ffd696;border-left:5px solid #f59e0b;border-radius:15px;background:#fff8eb;color:#634316}
        .a16-phase-alert>strong{display:block;margin-bottom:5px;color:#9a5800;font-size:17px}
        .a16-phase-alert p{margin:0 0 6px;color:#705022;font-size:14px;line-height:1.7}
        .a16-phase-alert b{display:block;color:#a43e11;font-size:14px}
        .a16-guide-steps{display:grid;gap:12px}
        .a16-guide-step{padding:17px 18px;border:1px solid #e0e8f0;border-radius:15px;background:#f8fbfe}
        .a16-guide-step h4{display:flex;align-items:center;gap:10px;margin:0 0 7px;color:#142a46;font-size:16px;line-height:1.4}
        .a16-guide-step h4 span{flex:0 0 auto;width:27px;height:27px;display:grid;place-items:center;border-radius:8px;background:linear-gradient(135deg,#1478ff,#31c9ff);color:#fff;font-size:13px;font-weight:900}
        .a16-guide-step p{margin:0;color:#53657a;font-size:14px;line-height:1.75}
        .a16-guide-step code{display:inline-block;padding:2px 7px;border-radius:7px;background:#e5f2ff;color:#066dc3;font-size:.95em;font-weight:900;overflow-wrap:anywhere}
        .a16-step-emphasis{margin-top:9px!important;padding:10px 12px;border-radius:10px;background:#edf6ff;color:#075f9f!important;font-weight:800}
        .a16-required-step{position:relative;border:2px solid #1687ff;background:linear-gradient(145deg,#f4faff,#edf7ff)}
        .a16-required-label{display:inline-flex;margin-bottom:10px;padding:4px 9px;border-radius:999px;background:#0877d8;color:#fff;font-size:11px;font-weight:900;letter-spacing:.04em}
        .a16-do-not-stop{display:block;margin-top:10px;color:#c23c16;font-size:15px}
        .a16-blind-note{margin-top:13px;padding:13px 14px;border-left:4px solid #f59e0b;border-radius:10px;background:#fff8ea}
        .a16-blind-note>strong{display:block;margin-bottom:4px;color:#8d5200;font-size:14px}
        .a16-blind-note p{color:#694e25;font-size:13px;line-height:1.7}
        .a16-latest-link{display:inline-flex;align-items:center;justify-content:center;min-height:44px;margin-top:14px;padding:0 17px;border-radius:11px;background:linear-gradient(135deg,#1478ff,#27c2ff);color:#fff;font-size:13px;font-weight:900;box-shadow:0 10px 24px rgba(22,135,255,.22)}
        .a16-latest-link:hover{transform:translateY(-1px)}
        @media(max-width:900px){
          .a16-modal{padding:18px}
          .a16-modal-panel{max-height:calc(100vh - 36px);max-height:calc(100dvh - 36px);padding:30px 27px 26px}
        }
        @media(max-width:600px){
          .a16-guide-trigger{width:100%;min-height:38px;margin-top:9px;font-size:12px}
          .a16-modal{padding:10px;align-items:end}
          .a16-modal-panel{width:100%;max-height:calc(100vh - 20px);max-height:calc(100dvh - 20px);padding:25px 17px 20px;border-radius:20px}
          .a16-modal-close{width:40px;height:40px;margin:-9px -7px 0 10px;font-size:27px}
          .a16-modal h3{padding-right:40px;font-size:21px}
          .a16-modal-content{margin-top:18px}
          .a16-phase-alert{padding:14px 13px}
          .a16-phase-alert>strong{font-size:15px}
          .a16-guide-steps{gap:9px}
          .a16-guide-step{padding:14px 13px;border-radius:13px}
          .a16-guide-step h4{font-size:15px;gap:8px;align-items:flex-start}
          .a16-guide-step p{font-size:13px;line-height:1.7}
          .a16-latest-link{width:100%}
        }
        @media(prefers-reduced-motion:reduce){.a16-modal,.a16-modal-panel{transition:none}}
      `;
      doc.head.appendChild(style);

      applied = true;
      loading.classList.add('hide');
      return true;
    }

    preview.addEventListener('load', () => {
      let attempts = 0;
      const timer = setInterval(() => {
        attempts += 1;
        if(applyFinalUpdates() || attempts > 240){
          clearInterval(timer);
          if(attempts > 240) loading.classList.add('hide');
        }
      },100);
    });
  </script>
</body>
</html>
