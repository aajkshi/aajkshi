<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#050b14">
  <title>NAVLYNX Android 16 升級專區預覽</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#050b14;color:#eaf5ff;font-family:"Noto Sans TC","Microsoft JhengHei",Arial,sans-serif}
    .loading{width:min(430px,calc(100% - 40px));padding:28px;border:1px solid rgba(72,197,255,.22);border-radius:20px;background:#0b192b;text-align:center;box-shadow:0 24px 70px rgba(0,0,0,.35)}
    .loading b{display:block;font-size:20px;margin-bottom:7px}.loading span{color:#9db3c8}.dot{width:34px;height:34px;margin:0 auto 17px;border:3px solid rgba(255,255,255,.18);border-top-color:#31c8ff;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
    .error{display:none}.error a{display:inline-block;margin-top:14px;padding:10px 16px;border-radius:10px;background:#1687ff;color:#fff;text-decoration:none;font-weight:800}
  </style>
</head>
<body>
  <div class="loading" id="loading">
    <div class="dot"></div>
    <b>正在載入 NAVLYNX 預覽頁面</b>
    <span>請稍候，系統正在套用最新版面修正。</span>
    <div class="error" id="error">
      <p>預覽載入失敗，請重新整理頁面。</p>
      <a href="https://www.navlynx.com.tw/index.asp">返回 NAVLYNX 官網</a>
    </div>
  </div>
  <script>
    (async function(){
      const source = 'https://raw.githubusercontent.com/aajkshi/aajkshi/74504a2a6cf4ae1f8a3e066544789e6d69e997fa/navlynx-android16-preview/index.html';
      try{
        const response = await fetch(source, {cache:'no-store'});
        if(!response.ok) throw new Error('HTTP '+response.status);
        let html = await response.text();

        html = html.replace('</style>', `
          /* 修正：深色區塊中的白色卡片需使用深色文字 */
          .choice:not(.blue){color:var(--ink)}
          .choice:not(.blue) h3{color:#102039}
          .choice:not(.blue) .ticks li{color:#405168}
          .choice:not(.blue) .choice-label{color:#1687ff}
          .choice:not(.blue) p{color:#66788b}
          .choice,.plan,.model,.step,.warning{min-width:0}
          @media(max-width:900px){body{padding-bottom:86px}.mobile-bar{border-top:1px solid rgba(255,255,255,.10)}}
        </style>`);

        /* 方案一、方案二皆為平行選項，不預設醒目選取 */
        html = html.replace('class="plan featured"','class="plan"');

        /* 統一官網正式 Touch 圖與文字間距 */
        html = html.replaceAll('Touch_pro-1.png','Touch_pro.png');
        html = html.replaceAll('3至7','3 至 7');
        html = html.replaceAll('10至15','10 至 15');
        html = html.replaceAll('20至30','20 至 30');

        document.open();
        document.write(html);
        document.close();
      }catch(error){
        console.error(error);
        document.querySelector('.dot').style.display='none';
        document.querySelector('#loading > span').style.display='none';
        document.getElementById('error').style.display='block';
      }
    })();
  </script>
</body>
</html>
