<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#050b14">
  <title>NAVLYNX Android 16 升級專區預覽</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#050b14;color:#eaf5ff;font-family:"Noto Sans TC","Microsoft JhengHei",Arial,sans-serif}
    .loading{width:min(430px,calc(100% - 40px));padding:28px;border:1px solid rgba(72,197,255,.22);border-radius:20px;background:#0b192b;text-align:center;box-shadow:0 24px 70px rgba(0,0,0,.35)}
    .loading b{display:block;font-size:20px;margin-bottom:7px}.loading span{color:#9db3c8}.dot{width:34px;height:34px;margin:0 auto 17px;border:3px solid rgba(255,255,255,.18);border-top-color:#31c8ff;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
    .error{display:none}.error a{display:inline-block;margin-top:14px;padding:10px 16px;border-radius:10px;background:#1687ff;color:#fff;text-decoration:none;font-weight:800}
  </style>
</head>
<body>
  <div class="loading" id="loading">
    <div class="dot"></div>
    <b>正在載入 NAVLYNX 預覽頁面</b>
    <span>請稍候，系統正在套用最新版面修正。</span>
    <div class="error" id="error">
      <p>預覽載入失敗，請重新整理頁面。</p>
      <a href="https://www.navlynx.com.tw/index.asp">返回 NAVLYNX 官網</a>
    </div>
  </div>
  <script>
    (async function(){
      const source = 'https://raw.githubusercontent.com/aajkshi/aajkshi/74504a2a6cf4ae1f8a3e066544789e6d69e997fa/navlynx-android16-preview/index.html';
      const mellingImage = 'assets/melling.svg?v=191575dd';
      try{
        const response = await fetch(source, {cache:'no-store'});
        if(!response.ok) throw new Error('HTTP '+response.status);
        const original = await response.text();
        const doc = new DOMParser().parseFromString(original, 'text/html');

        const style = doc.createElement('style');
        style.textContent = `
          .choice:not(.blue){color:var(--ink)}
          .choice:not(.blue) h3{color:#102039}
          .choice:not(.blue) .ticks li{color:#405168}
          .choice:not(.blue) .choice-label{color:#1687ff}
          .choice:not(.blue) p{color:#66788b}
          .choice,.plan,.model,.step,.warning{min-width:0}
          .visual .one{width:84%;right:8%;top:3%}
          .prep{position:static!important;top:auto!important}
          .download-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
          .download-card{display:flex;flex-direction:column;min-height:210px;padding:24px;border:1px solid var(--line);border-radius:20px;background:#fff;box-shadow:var(--shadow)}
          .download-card small{font-weight:900;color:#1687ff;letter-spacing:.08em}
          .download-card h3{margin:10px 0 5px;font-size:20px;line-height:1.35}
          .download-card p{margin:0 0 18px;color:#687a8d;font-size:14px}
          .download-card .btn{margin-top:auto}
          .latest-box{margin-top:18px;padding:27px;border-radius:22px;background:linear-gradient(135deg,#0b2340,#0d5ba7 58%,#118bd2);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:24px}
          .latest-box h3{margin:0 0 5px;font-size:24px}.latest-box p{margin:0;color:#c9e1f4}
          .bmw-note{margin-top:22px;padding:22px 24px;border:1px solid #cfe3f5;border-radius:18px;background:#f4f9fd;box-shadow:0 14px 34px rgba(6,49,87,.08)}
          .bmw-note-head{display:flex;align-items:center;gap:10px;margin-bottom:7px;color:#0b63a8;font-weight:900}
          .bmw-note-dot{width:9px;height:9px;border-radius:50%;background:#e92c2c;box-shadow:0 0 0 5px rgba(233,44,44,.10)}
          .bmw-note p{margin:0 0 14px;color:#4c6175}
          .bmw-mode{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:13px 15px;border-radius:13px;background:#fff;border:1px solid #d7e5f0}
          .bmw-mode strong{color:#12243d}.bmw-mode code{padding:5px 9px;border-radius:8px;background:#eaf4ff;color:#096bc2;font-size:15px;font-weight:900}
          .red-light{display:inline-flex;align-items:center;gap:7px;color:#4c6175}.red-light i{width:11px;height:11px;border-radius:50%;background:#e92c2c;box-shadow:0 0 0 4px rgba(233,44,44,.12)}
          .bmw-note a{display:inline-flex;margin-top:13px;color:#0676d7;font-weight:900}
          @media(max-width:900px){body{padding-bottom:86px}.mobile-bar{border-top:1px solid rgba(255,255,255,.10)}.download-grid{grid-template-columns:repeat(2,1fr)}}
          @media(max-width:580px){.visual .one{width:86%;right:7%;top:2%}.download-grid{grid-template-columns:1fr}.latest-box{align-items:flex-start;flex-direction:column}.latest-box .btn{width:100%}.bmw-mode{align-items:flex-start;flex-direction:column;gap:8px}}
        `;
        doc.head.appendChild(style);

        doc.querySelector('.plan.featured')?.classList.remove('featured');
        doc.querySelectorAll('img[src*="Touch_pro-1.png"]').forEach(img => img.src = img.src.replace('Touch_pro-1.png','Touch_pro.png'));

        const heroVisual = doc.querySelector('.visual');
        if(heroVisual) heroVisual.setAttribute('aria-label','ApplePie ONE 產品圖');
        doc.querySelector('.visual .melling')?.remove();
        doc.querySelector('.hero-note')?.remove();

        const mellingCardImage = [...doc.querySelectorAll('.model img')].find(img => (img.alt || '').includes('Melling'));
        if(mellingCardImage) mellingCardImage.src = mellingImage;

        const removeExactParagraph = (text) => {
          [...doc.querySelectorAll('p')].filter(p => p.textContent.trim() === text).forEach(p => p.remove());
        };
        removeExactParagraph('目前提供以下五款機型升級。Melling 與 Melling-G 外觀完全相同，因此整合顯示。');
        removeExactParagraph('※ 實際升級方式仍須依產品型號、序號、硬體批次及目前系統版本確認。');
        removeExactParagraph('後續各機型會建立各自分頁，並導入對應的 Google 雲端硬碟下載連結。');

        const replaceText = (from, to) => {
          const walker = doc.createTreeWalker(doc.body, NodeFilter.SHOW_TEXT);
          const nodes = [];
          while(walker.nextNode()) nodes.push(walker.currentNode);
          nodes.forEach(node => { if(node.nodeValue.includes(from)) node.nodeValue = node.nodeValue.replaceAll(from,to); });
        };
        replaceText('3至7','3 至 7');
        replaceText('10至15','10 至 15');
        replaceText('20至30','20 至 30');
        replaceText('先備份個人資料','備份個人資料');
        replaceText('先升級至 Android 16 指定版本，再更新最新韌體','先升級至 Android 16 指定版本，再更新到最新韌體');
        replaceText('包含台灣本島來回運費','包含台灣來回運費');

        const setLink = (selector, href, text) => {
          const el = doc.querySelector(selector);
          if(el){ el.href = href; if(text) el.textContent = text; }
        };
        setLink('.nav a[href="#self"]','#downloads','首次升級下載');
        setLink('.actions .btn.primary','#downloads','首次升級下載');
        setLink('.choice.blue .btn','#downloads','進入首次升級下載');
        setLink('.mobile-bar a[href="#self"]','#downloads','首次升級下載');

        const downloads = doc.createElement('section');
        downloads.id = 'downloads';
        downloads.innerHTML = `
          <div class="wrap">
            <div class="section-head">
              <div class="kicker">FIRST ANDROID 16 UPGRADE</div>
              <h2>首次升級 Android 16 下載專區</h2>
              <p>請依照您的 ApplePie 機型，下載對應的 Android 16 指定版本。不同機型的檔案請勿混用。</p>
            </div>
            <div class="download-grid">
              <article class="download-card"><small>ANDROID 16</small><h3>ApplePie ONE</h3><p>首次升級 Android 16 指定版本</p><a class="btn primary" href="https://drive.google.com/drive/folders/11abZ4MpHONdx1gK_z1eEfdAWEHTy2_mi?usp=drive_link" target="_blank" rel="noopener">前往下載</a></article>
              <article class="download-card"><small>ANDROID 16</small><h3>ApplePie Touch</h3><p>首次升級 Android 16 指定版本</p><a class="btn primary" href="https://drive.google.com/drive/folders/1T5LIQH-WMlWCCyztKkGnt5S6KiH51MHk?usp=drive_link" target="_blank" rel="noopener">前往下載</a></article>
              <article class="download-card"><small>ANDROID 16</small><h3>ApplePie mini Ultra II</h3><p>首次升級 Android 16 指定版本</p><a class="btn primary" href="https://drive.google.com/drive/folders/10ftWBlYjTytoOWk_ZxGz11CMXJql8pRk?usp=drive_link" target="_blank" rel="noopener">前往下載</a></article>
              <article class="download-card"><small>ANDROID 16</small><h3>ApplePie Melling／Melling-G</h3><p>首次升級 Android 16 指定版本</p><a class="btn primary" href="https://drive.google.com/drive/folders/1kBohVCC0wrtqiwx3Nq8we56KSWQpG9KI?usp=drive_link" target="_blank" rel="noopener">前往下載</a></article>
            </div>
            <div class="latest-box">
              <div><h3>後續 Android 16 韌體更新</h3><p>完成首次 Android 16 升級後，請前往 NAVLYNX 韌體下載頁，更新到最新韌體。</p></div>
              <a class="btn primary" href="https://www.navlynx.com.tw/download.asp" target="_blank" rel="noopener">前往最新韌體下載</a>
            </div>
          </div>`;
        doc.querySelector('#self')?.before(downloads);

        doc.querySelector('.prep .btn')?.remove();

        const bmwNote = doc.createElement('div');
        bmwNote.className = 'bmw-note';
        bmwNote.innerHTML = `
          <div class="bmw-note-head"><span class="bmw-note-dot"></span><span>BMW 車款連線提醒</span></div>
          <p>若您的車款使用 BMW ID6 或 OS9 車載系統，完成 Android 16 更新後若不易連接，請切換為「無線 CarPlay（BMW 相容模式）」。</p>
          <div class="bmw-mode"><strong>輸入代碼</strong><code>#135177</code><span class="red-light"><i></i>氛圍燈：紅色</span></div>
          <a href="https://www.navlynx.com.tw/teaching_in_a11-P1.asp" target="_blank" rel="noopener">查看 ApplePie 連接模式切換教學 →</a>`;
        const selfWrap = doc.querySelector('#self .wrap');
        if(selfWrap) selfWrap.appendChild(bmwNote);

        document.open();
        document.write('<!doctype html>'+doc.documentElement.outerHTML);
        document.close();
      }catch(error){
        console.error(error);
        document.querySelector('.dot').style.display='none';
        document.querySelector('#loading > span').style.display='none';
        document.getElementById('error').style.display='block';
      }
    })();
  </script>
</body>
</html>
