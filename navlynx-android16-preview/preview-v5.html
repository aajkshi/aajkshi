  <iframe id="previewV5" src="preview-v4.html?v=20260905-11" title="NAVLYNX Android 16 升級專區預覽"></iframe>
  <script>
    const previewV5 = document.getElementById('previewV5');
    const loading = document.getElementById('loading');
    let applied = false;

    function getSiteDocument(){
      try{
        const v4Doc = previewV5.contentDocument || previewV5.contentWindow.document;
        const v3Frame = v4Doc && v4Doc.getElementById('previewV4');
        const v3Doc = v3Frame && (v3Frame.contentDocument || v3Frame.contentWindow.document);
        const v2Frame = v3Doc && v3Doc.getElementById('preview');
        const v2Doc = v2Frame && (v2Frame.contentDocument || v2Frame.contentWindow.document);
        const siteFrame = v2Doc && v2Doc.getElementById('site');
        return siteFrame && (siteFrame.contentDocument || siteFrame.contentWindow.document);
      }catch(error){
        return null;
      }
    }

    function applyMouseFirmwareUpdates(){
      if(applied) return true;
      const doc = getSiteDocument();
      if(!doc || !doc.body) return false;

      const hero = doc.querySelector('.hero');
      const models = doc.querySelector('#models');
      const downloads = doc.querySelector('#downloads');
      const selfSection = doc.querySelector('#self');
      const mailSection = doc.querySelector('#mail');
      const noticeSection = doc.querySelector('#notice');
      const roadmap = doc.querySelector('.a16-roadmap');
      const modalTriggers = [...doc.querySelectorAll('.a16-guide-trigger')];
      if(!hero || !models || !downloads || !selfSection || !mailSection || !noticeSection || !roadmap || modalTriggers.length < 4) return false;

      if(!hero.querySelector('.a16-hero-decor')){
        const decor = doc.createElement('div');
        decor.className = 'a16-hero-decor';
        decor.setAttribute('aria-hidden','true');

          <span class="a16-bg-number">16</span>
          <span class="a16-bg-label a16-label-one">ANDROID 16</span>

        hero.appendChild(decor);

      if(!doc.querySelector('.a16-mouse-alert')){
        const alert = doc.createElement('div');

        <div class="a16-roadmap-arrow" aria-hidden="true">→</div>

        <p>有使用飛鼠者，請先完成飛鼠韌體升級；Android 16 的兩個階段也都完成後，才算升級完成。</p>`;

                    <li>NAVLYNX ApplePie 主機</li>
                    <li>NAVLYNX 飛鼠遙控器</li>
                    <li>SIM 卡針，ApplePie mini 系列免卡針</li>
                  </ul>
                  <a class="a16-file-download" href="https://applepie.work/remote" target="_blank" rel="noopener noreferrer">下載飛鼠韌體檔與 APK</a>
                </div>
                <div class="a16-mouse-panel a16-chapters">
                  <h3>影片章節</h3>
                  <div class="a16-chapter-list">
                    <a href="https://youtu.be/b_8Xvcvy9G4?t=0" target="_blank" rel="noopener"><b>00:00</b><span>前言＋準備材料</span></a>
                    <a href="https://youtu.be/b_8Xvcvy9G4?t=19" target="_blank" rel="noopener"><b>00:19</b><span>STEP 1｜遙控器（飛鼠）配對</span></a>
                    <a href="https://youtu.be/b_8Xvcvy9G4?t=39" target="_blank" rel="noopener"><b>00:39</b><span>STEP 2｜插入記憶卡</span></a>
                    <a href="https://youtu.be/b_8Xvcvy9G4?t=52" target="_blank" rel="noopener"><b>00:52</b><span>STEP 3｜安裝 APK 程式</span></a>
                    <a href="https://youtu.be/b_8Xvcvy9G4?t=69" target="_blank" rel="noopener"><b>01:09</b><span>STEP 4｜複製韌體檔至「下載」資料夾</span></a>
                    <a href="https://youtu.be/b_8Xvcvy9G4?t=90" target="_blank" rel="noopener"><b>01:30</b><span>STEP 5｜執行韌體升級</span></a>
                    <a href="https://youtu.be/b_8Xvcvy9G4?t=141" target="_blank" rel="noopener"><b>02:21</b><span>STEP 6｜等待升級完成</span></a>

            </div>
          </div>`;
        downloads.insertAdjacentElement('beforebegin', mouseSection);
      }

      const nav = doc.querySelector('.nav');
      if(nav && !nav.querySelector('a[href="#mouse-firmware"]')){
        const link = doc.createElement('a');
        link.href = '#mouse-firmware';
        link.textContent = '飛鼠韌體';
        const downloadsLink = nav.querySelector('a[href="#downloads"]');
        nav.insertBefore(link, downloadsLink || nav.firstChild);

      modalTriggers.forEach((trigger) => {
        if(trigger.dataset.mouseReminderBound) return;
        trigger.dataset.mouseReminderBound = '1';
        trigger.addEventListener('click', () => {
          setTimeout(() => {
            const content = doc.querySelector('.a16-modal-content');
            if(!content || content.querySelector('.a16-modal-mouse-note')) return;
            const note = doc.createElement('div');
            note.className = 'a16-modal-mouse-note';
            note.innerHTML = '<strong>有使用 NAVLYNX 飛鼠？</strong><p>進行 Android 16 升級前，請先完成飛鼠韌體升級，否則升級後飛鼠將無法正常使用。</p><a href="#mouse-firmware">先查看飛鼠韌體升級教學</a>';

            const noteLink = note.querySelector('a');

              event.preventDefault();
              doc.querySelector('.a16-modal-close')?.click();
              setTimeout(() => doc.querySelector('#mouse-firmware')?.scrollIntoView({behavior:'smooth'}), 220);
            });
          }, 0);
        });
      });

      const inlinePhase = selfSection.querySelector('.a16-inline-phase');
      if(inlinePhase && !inlinePhase.querySelector('.a16-inline-mouse-note')){
        const note = doc.createElement('a');
        note.className = 'a16-inline-mouse-note';
        note.href = '#mouse-firmware';
        note.innerHTML = '<strong>有使用飛鼠者，請先完成飛鼠韌體升級</strong><span>完成後再開始下方 Android 16 兩階段流程。</span>';

      }

      if(!mailSection.querySelector('.a16-mail-mouse-note')){
        const mailHead = mailSection.querySelector('.section-head');
        const mailNote = doc.createElement('div');
        mailNote.className = 'a16-mail-mouse-note';
        mailNote.innerHTML = '<div class="a16-mail-mouse-icon" aria-hidden="true">⌁</div><div><strong>有 NAVLYNX 飛鼠，請與 ApplePie 主機一併寄回</strong><p>總公司會同步處理飛鼠韌體並完成配對確認；沒有飛鼠的用戶，只需寄送 ApplePie 主機。</p></div>';

      }

      const mailSteps = [...mailSection.querySelectorAll('.mail-step')];
      if(mailSteps[2]) mailSteps[2].innerHTML = '<b>03 寄送主機</b>依客服提供的寄送資訊妥善包裝；如有 NAVLYNX 飛鼠，請一併寄回。';

        const title = warning.querySelector('h3');
        const text = warning.querySelector('p');
        if(title && title.textContent.includes('移除 SIM 卡與記憶卡')){
          if(text) text.textContent = '寄送前請移除 SIM 卡、記憶卡與線材；如有 NAVLYNX 飛鼠，請將飛鼠與主機一併寄回。';
        }
      });

      const walker = doc.createTreeWalker(doc.body, NodeFilter.SHOW_TEXT);
      const textNodes = [];
      while(walker.nextNode()) textNodes.push(walker.currentNode);
      textNodes.forEach((node) => {
        if(node.nodeValue.includes('請勿附上線材、飛鼠或其他配件')) node.nodeValue = node.nodeValue.replace('請勿附上線材、飛鼠或其他配件','請勿附上線材；如有 NAVLYNX 飛鼠，請一併寄回');

      });

      const style = doc.createElement('style');
      style.textContent = `

        .hero>.wrap,.hero .hero-grid{position:relative;z-index:2}
        .a16-hero-decor{position:absolute;inset:0;z-index:0;overflow:hidden;pointer-events:none}

        .a16-inline-mouse-note strong{font-size:14px}.a16-inline-mouse-note span{color:#805f2a;font-size:12px;text-align:right}
        .a16-modal-mouse-note{margin-bottom:15px;padding:14px 15px;border:1px solid #f1d08e;border-left:5px solid #f3a927;border-radius:13px;background:#fff6e1;color:#62400d}
        .a16-modal-mouse-note strong{display:block;color:#945300;font-size:15px}.a16-modal-mouse-note p{margin:3px 0 8px;color:#735323;font-size:13px;line-height:1.65}.a16-modal-mouse-note a{color:#0877d8;font-size:12px;font-weight:900;text-decoration:underline;text-underline-offset:3px}

        .a16-mail-mouse-note{display:grid;grid-template-columns:54px minmax(0,1fr);gap:17px;align-items:center;margin:-7px 0 26px;padding:20px 22px;border:1px solid #d8e7f3;border-left:5px solid #1687ff;border-radius:17px;background:#f4f9fd;box-shadow:0 12px 34px rgba(7,49,91,.07)}
        .a16-mail-mouse-icon{width:50px;height:50px;display:grid;place-items:center;border-radius:15px;background:linear-gradient(135deg,#1478ff,#31c9ff);color:#fff;font-size:27px;font-weight:900}.a16-mail-mouse-note strong{display:block;color:#17314e;font-size:17px}.a16-mail-mouse-note p{margin:3px 0 0;color:#5a6e82;font-size:13px}

        @media(max-width:1000px){
          .a16-mouse-grid{grid-template-columns:1fr}
          .a16-mouse-info{grid-template-columns:1fr 1fr}
          .a16-chapter-list{grid-template-columns:1fr}
        }
        @media(max-width:900px){
          .a16-bg-number{right:-7%;top:11%;font-size:clamp(240px,54vw,430px)}
          .a16-bot{right:4%;top:12%;opacity:.7}
          .a16-roadmap{grid-template-columns:1fr!important;gap:9px!important}
          .a16-roadmap-arrow{justify-self:center;line-height:1;transform:rotate(90deg);font-size:24px}
          .a16-roadmap-mouse{margin:0;padding:11px 12px}
          .a16-mouse-alert-inner{align-items:flex-start;flex-direction:column;gap:11px}.a16-mouse-alert-inner>div{grid-template-columns:auto 1fr}.a16-mouse-alert a{margin-left:0}
        }
        @media(max-width:650px){
          .a16-mouse-section{padding:64px 0}
          .a16-mouse-head h2 br{display:none}
          .a16-mouse-critical{justify-content:flex-start;align-items:flex-start;flex-direction:column}.a16-mouse-critical i{transform:rotate(90deg);margin-left:20px}
          .a16-mouse-info{grid-template-columns:1fr}
          .a16-video-copy,.a16-mouse-panel{padding:18px}
          .a16-video-copy h3{font-size:20px}
          .a16-mouse-bluetooth-warning{grid-template-columns:1fr;padding:17px}.a16-bluetooth-icon{width:42px;height:42px}
          .a16-inline-mouse-note{align-items:flex-start;flex-direction:column;gap:3px}.a16-inline-mouse-note span{text-align:left}
          .a16-mail-mouse-note{grid-template-columns:43px minmax(0,1fr);gap:12px;padding:17px 15px}.a16-mail-mouse-icon{width:42px;height:42px;border-radius:12px}.a16-mail-mouse-note strong{font-size:15px}
          .a16-mouse-alert-inner>div{display:flex;align-items:flex-start;flex-direction:column;gap:4px}.a16-mouse-alert p{font-size:12px}.a16-mouse-alert a{width:100%;text-align:center}
          .a16-bg-number{top:16%;right:-12%;font-size:250px}.a16-label-two,.a16-bot{display:none}
        }
      `;
      doc.head.appendChild(style);

      applied = true;
      loading.classList.add('hide');
      return true;
    }

    previewV5.addEventListener('load', () => {
      let attempts = 0;
      const timer = setInterval(() => {
        attempts += 1;
        if(applyMouseFirmwareUpdates() || attempts > 360){
          clearInterval(timer);
          loading.classList.add('hide');
        }
      },100);
    });
  </script>
</body>
</html>
