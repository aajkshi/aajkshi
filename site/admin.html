<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JE Admin (Static MVP)</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <header class="header"><div class="container nav"><div class="brand">JE Admin</div><a class="btn" href="./index.html">回前台</a></div></header>

  <section id="login" class="container admin-login">
    <article class="card">
      <h2>後台登入</h2>
      <p class="muted">MVP 靜態版示範帳密：admin / 1234</p>
      <div class="grid"><input id="u" placeholder="帳號" value="admin"><input id="p" type="password" placeholder="密碼" value="1234"><button class="btn primary" id="doLogin">登入</button></div>
    </article>
  </section>

  <section id="panel" class="section hidden">
    <div class="container">
      <div class="toolbar">
        <button class="btn" data-tab="dash">Dashboard</button>
        <button class="btn" data-tab="orders">訂單管理</button>
        <button class="btn" data-tab="products">商品管理</button>
        <button class="btn" data-tab="cases">案例管理</button>
        <button class="btn" data-tab="services">服務頁管理</button>
        <button class="btn" id="logout">登出</button>
      </div>

      <section data-page="dash"><div class="grid g3"><article class="card"><h3>今日訂單</h3><p id="d1"></p></article><article class="card"><h3>未付款</h3><p id="d2"></p></article><article class="card"><h3>營收總和</h3><p id="d3"></p></article></div></section>

      <section data-page="orders" class="hidden">
        <div class="toolbar"><input id="oq" placeholder="搜尋訂單編號/姓名/電話"><select id="os"><option value="all">全部</option><option value="pending_payment">待付款</option><option value="paid">已付款</option><option value="shipped">出貨</option><option value="completed">完成</option><option value="cancelled">取消</option></select><button class="btn" id="csv">匯出CSV</button></div>
        <div class="table-wrap"><table><thead><tr><th>訂單編號</th><th>客戶</th><th>電話</th><th>總額</th><th>狀態</th></tr></thead><tbody id="ot"></tbody></table></div>
      </section>

      <section data-page="products" class="hidden"><article class="card"><h3>商品（示範）</h3><div id="pt" class="grid g3"></div></article></section>
      <section data-page="cases" class="hidden"><article class="card"><h3>案例（示範）</h3><div id="ct" class="grid g2"></div></article></section>
      <section data-page="services" class="hidden"><article class="card"><h3>服務頁（示範）</h3><div id="st" class="grid g2"></div></article></section>
    </div>
  </section>

<script>
const money=n=>`NT$ ${Number(n).toLocaleString('zh-TW')}`;
const load=(k,f)=>{try{return JSON.parse(localStorage.getItem(k))??f}catch{return f}};
let ORD=load('je_orders',[]), P=load('je_products',[]), C=load('je_cases',[]), S=load('je_services',[]);
const q=s=>document.querySelector(s), qa=s=>Array.from(document.querySelectorAll(s));

function renderDash(){
  const t=new Date().toISOString().slice(0,10);
  q('#d1').textContent=ORD.filter(o=>o.createdAt?.slice(0,10)===t).length;
  q('#d2').textContent=ORD.filter(o=>o.status==='pending_payment').length;
  q('#d3').textContent=money(ORD.reduce((a,b)=>a+(b.total||0),0));
}
function renderOrders(){
  const qv=q('#oq').value||'', sv=q('#os').value;
  const list=ORD.filter(o=>(sv==='all'||o.status===sv) && `${o.id}${o.customer?.name||''}${o.customer?.phone||''}`.includes(qv));
  q('#ot').innerHTML=list.map(o=>`<tr><td>${o.id}</td><td>${o.customer?.name||''}</td><td>${o.customer?.phone||''}</td><td>${money(o.total||0)}</td><td><select onchange="upd('${o.id}',this.value)"><option ${o.status==='pending_payment'?'selected':''} value='pending_payment'>待付款</option><option ${o.status==='paid'?'selected':''} value='paid'>已付款</option><option ${o.status==='shipped'?'selected':''} value='shipped'>出貨</option><option ${o.status==='completed'?'selected':''} value='completed'>完成</option><option ${o.status==='cancelled'?'selected':''} value='cancelled'>取消</option></select></td></tr>`).join('')||'<tr><td colspan="5">尚無資料</td></tr>';
}
function upd(id,s){ ORD=ORD.map(o=>o.id===id?{...o,status:s}:o); localStorage.setItem('je_orders',JSON.stringify(ORD)); renderDash(); renderOrders(); }
window.upd=upd;
function renderList(){
  q('#pt').innerHTML=P.map(x=>`<div class='card'><h4>${x.name}</h4><p>${x.category}</p><p>${money(x.price)}</p></div>`).join('');
  q('#ct').innerHTML=C.map(x=>`<div class='card'><h4>${x.title}</h4><p>${x.bodyPart} / ${x.skin} / ${x.store}</p></div>`).join('');
  q('#st').innerHTML=S.map(x=>`<div class='card'><h4>${x.name}</h4><p>${x.category}</p><p>${money(x.price)}</p></div>`).join('');
}
function csv(){
  const head=['orderNo','name','phone','total','status','createdAt'];
  const rows=ORD.map(o=>[o.id,o.customer?.name||'',o.customer?.phone||'',o.total||0,o.status,o.createdAt||'']);
  const text=[head,...rows].map(r=>r.map(v=>`"${String(v).replaceAll('"','""')}"`).join(',')).join('\n');
  const blob=new Blob([text],{type:'text/csv;charset=utf-8;'}), a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download='orders.csv'; a.click(); URL.revokeObjectURL(a.href);
}

q('#doLogin').onclick=()=>{ if(q('#u').value==='admin'&&q('#p').value==='1234'){ q('#login').classList.add('hidden'); q('#panel').classList.remove('hidden'); renderDash(); renderOrders(); renderList(); } else alert('帳密錯誤'); };
q('#logout').onclick=()=>location.reload();
q('#oq').oninput=renderOrders; q('#os').onchange=renderOrders; q('#csv').onclick=csv;
qa('[data-tab]').forEach(b=>b.onclick=()=>{ qa('#panel section[data-page]').forEach(s=>s.classList.add('hidden')); q(`#panel section[data-page="${b.dataset.tab}"]`).classList.remove('hidden'); });
</script>
</body>
</html>
